[project]
name = "qgf"
version = "0.1.0"
description = "Neutral-atom quantum graph features: code and data to reproduce the paper"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.6.1",
    "numpy>=1.26",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "torch>=2.4",
    "torch-geometric>=2.5",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
stats = [
    "baycomp>=1.0.3",
    "pystan>=3.4",
]
generate = [
    "emu-mps>=2.9.1",
    "emu-sv>=2.9.1",
    "pasqal-cloud>=0.24.0",
    "pulser>=1.9.1",
    "qoolqit>=1.4.0",
]
esa = [
    "bitsandbytes>=0.45 ; sys_platform == 'linux'",
    "pytorch-lightning>=2.5",
    "torchmetrics>=1.8",
]

[dependency-groups]
dev = ["pytest>=8", "ruff==0.16.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qgf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long or reference-data tests (run with -m slow)"]
addopts = "-m 'not slow'"
filterwarnings = [
    # torch_geometric still calls torch.jit.script at import time
    "ignore:`torch.jit.script` is deprecated:DeprecationWarning",
    # tiny synthetic test sets have rare classes under 5-fold stratification
    "ignore:The least populated class in y:UserWarning:sklearn",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B905 (zip without strict=): zips over equal-length sequences by construction; adding
# strict= everywhere would be a mass rewrite of ported code.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# Markdown / LaTeX report templates: long literal lines are kept verbatim from the original.
"src/qgf/stats/pe_benchmark.py" = ["E501"]
"src/qgf/intrinsic/tables.py" = ["E501"]

# CUDA 12.8 wheels: the A100 nodes' driver does not support the default cu13 build.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
